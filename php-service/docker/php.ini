; Konfigurasi produksi. ${VAR} dibaca dari environment saat php-fpm start.
expose_php = Off
memory_limit = 128M

; Opcache: bytecode di-cache di shared memory -> file PHP tidak di-parse ulang tiap request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.validate_timestamps = 0
; JIT (PHP 8+): "tracing" (default di image ini) atau "disable". Coba bandingkan di skenario cpu!
opcache.jit = ${PHP_JIT}
opcache.jit_buffer_size = 32M

; APCu: key-value di shared memory, dipakai bersama oleh semua worker FPM.
apc.enabled = 1
apc.shm_size = 32M
