; Diberi nama zzz-* supaya di-load SETELAH zz-docker.conf bawaan image (yang set listen=9000).

; Pool utama: melayani API.
; Model PHP-FPM: 1 worker = 1 proses = 1 request pada satu waktu.
; Konkurensi maksimum = pm.max_children; sisanya antre di backlog socket.
[www]
listen = /tmp/php-fpm.sock
listen.backlog = 4096
pm = static
pm.max_children = ${PHP_WORKERS}
; 0 = worker tidak pernah di-recycle (produksi sering memakai ~500-1000 untuk menahan memory leak)
pm.max_requests = 0
; agar /proc/<pid>/smaps_rollup bisa dibaca untuk menghitung memori (PSS)
process.dumpable = yes

; Pool terpisah untuk /metrics: best practice agar endpoint ops/health tetap
; responsif walau semua worker [www] sedang sibuk.
[ops]
listen = /tmp/php-fpm-ops.sock
listen.backlog = 64
pm = static
pm.max_children = 1
pm.max_requests = 0
process.dumpable = yes
