server.port=${PORT:8080}
server.shutdown=graceful
spring.main.banner-mode=off

# Virtual threads (Java 21+): setiap request di-handle virtual thread yang murah,
# di-multiplex di atas sedikit OS thread -> model yang sama dengan goroutine Go.
spring.threads.virtual.enabled=true

# Default Tomcat menutup koneksi keep-alive setiap 100 request; disamakan dengan service lain.
server.tomcat.max-keep-alive-requests=-1

# Nama field JSON snake_case (uptime_sec, requests_total) dari field Java camelCase.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Jackson default menerima "12" (string) untuk field angka; Go/Rust menolaknya. Samakan.
spring.jackson.mapper.allow-coercion-of-scalars=false
